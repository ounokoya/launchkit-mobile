# Mobile CI (ADR-0016, P10): analysis, unit and screen tests with coverage ≥ 80 % and the reference captures,
# the A / B scenario on the real server stack (Linux target under xvfb), the Android demo APK and the iOS build.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  # Server repository, checked out to run the A / B scenario against the real stack.
  SERVER_REPO: ${{ github.repository_owner }}/launchkit-server

jobs:
  test:
    name: Analysis, tests, coverage, captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python3 tool/coverage.py 80
      - name: Known vulnerabilities in the dependencies (OSV)
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.2.2 scan source -L /src/pubspec.lock
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/

  scenario:
    name: Scenario A / B on the server stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVER_REPO }}
          path: server
      - name: Start the server stack (API, worker, ArangoDB, Mailpit)
        run: docker compose -f server/compose.yaml up --build --detach --wait
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: xvfb-run flutter test integration_test -d linux
      - if: failure()
        run: docker compose -f server/compose.yaml logs

  android:
    name: Android demo APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # API_URL, WEB_URL, MAILPIT_URL and WEB_HOST: repository variables, set once the demo is online (deploy).
      - run: >-
          flutter build apk --release
          --dart-define=API_URL=${{ vars.API_URL || 'http://10.0.2.2:5080' }}
          --dart-define=WEB_URL=${{ vars.WEB_URL || 'http://10.0.2.2:5173' }}
          --dart-define=MAILPIT_URL=${{ vars.MAILPIT_URL || 'http://10.0.2.2:8025' }}
          -PwebHost=${{ vars.WEB_HOST || 'localhost' }}
      - uses: actions/upload-artifact@v4
        with:
          name: launchkit-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build (no signing)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign
